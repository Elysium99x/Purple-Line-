<title>Purple Line Alignment</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --purple: #7B2D8B;
    --purple-light: #a855c8;
    --purple-dark: #4a1560;
    --tunnel: #c084db;
    --aerial: #e040fb;
    --bg: #f5f0f8;
    --panel-bg: rgba(255,255,255,0.97);
    --text: #1a0a22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--purple-dark);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(74,21,96,0.4);
    z-index: 1000;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    font-style: italic;
    letter-spacing: -0.02em;
    color: #f0d6ff;
  }

  header .subtitle {
    font-size: 0.65rem;
    color: #c9a8e0;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .badge {
    margin-left: auto;
    background: var(--purple-light);
    color: #fff;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  #map-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* Keep OSM tiles at full color */

  .legend {
    position: absolute;
    bottom: 32px;
    left: 16px;
    background: var(--panel-bg);
    border: 1.5px solid #d8bfe8;
    border-radius: 10px;
    padding: 14px 18px;
    z-index: 900;
    box-shadow: 0 4px 20px rgba(74,21,96,0.15);
    min-width: 210px;
  }

  .legend h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 0.8rem;
    color: var(--purple-dark);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
    font-size: 0.7rem;
    color: var(--text);
  }

  .legend-line {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-line.surface { background: var(--purple); }
  .legend-line.tunnel { background: var(--tunnel); border: none; border-top: 2px dashed var(--tunnel); background: transparent; height: 0; border-width: 2.5px; }
  .legend-line.aerial { background: var(--aerial); }


  /* Custom polyline popup */
  .leaflet-popup-content-wrapper {
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(74,21,96,0.2);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
  }

  .leaflet-popup-content {
    margin: 10px 14px;
  }

  .popup-title {
    font-family: 'DM Serif Display', serif;
    font-size: 0.95rem;
    color: var(--purple-dark);
    margin-bottom: 4px;
  }

  .popup-sub {
    color: #666;
    font-size: 0.68rem;
  }
</style>
</head>

  lineGroups.forEach(pts => {

    const poly = L.polyline(pts, {
      color: s.color,
      weight: s.weight,
      opacity: s.opacity,
      dashArray: s.dashArray,
      lineJoin: 'round',
      lineCap: 'round'
    }).addTo(map);

    poly.bindPopup(`
      <div class="popup-title">${name}</div>
      <div class="popup-sub">${s.label} · ${pts.length} waypoints (subsampled)</div>
    `);

    poly.on('mouseover', function() {
      this.setStyle({ weight: s.weight + 2, opacity: 1 });
    });
    poly.on('mouseout', function() {
      this.setStyle({ weight: s.weight, opacity: s.opacity });
    });
  });
});

// ── Lavender palette ─────────────────────────────────────────────────────────
const LV_DARK   = '#5b1f8a';   // deep purple-lavender (termini, headings)
const LV_MID    = '#8b5cf6';   // medium lavender (standard stations)
const LV_LIGHT  = '#c4b5fd';   // soft lavender (label fill)
const LV_XLIGHT = '#f3effe';   // near-white lavender (hover bg)
const LV_INTER  = '#e879f9';   // fuchsia accent for interchange indicator
const LV_LABEL  = '#ede9fe';   // label pill background

// Helper: draw the transit station SVG icon
// Icon is a rounded square with a stylised rail platform:
//   - roof arc at top
//   - two vertical pillars
//   - horizontal platform bar
// Termini get a diamond-star flourish; interchanges get a fuchsia ring.
function stationIconSVG(idx, isTerminus, isInterchange) {
  const SZ = isTerminus ? 22 : isInterchange ? 20 : 17; // icon square size
  const rx = 5;
  const fill  = isTerminus ? LV_DARK : LV_MID;
  const inner = '#fff';

  // Platform symbol inside the square (scaled to SZ)
  // Roof arc: a small semicircle arc across the top quarter
  const cx = SZ / 2, cy = SZ / 2;
  const roofY  = cy - SZ * 0.18;
  const roofR  = SZ * 0.26;
  // Two pillars
  const pillarW = SZ * 0.09, pillarH = SZ * 0.28;
  const pillarY = roofY + roofR * 0.6;
  const p1x = cx - SZ * 0.18, p2x = cx + SZ * 0.18 - pillarW;
  // Platform bar
  const platW = SZ * 0.62, platH = SZ * 0.09;
  const platX = cx - platW / 2, platY = pillarY + pillarH;

  const interRing = isInterchange && !isTerminus
    ? `<circle cx="${SZ/2}" cy="${SZ/2}" r="${SZ/2 + 2.5}" fill="none" stroke="${LV_INTER}" stroke-width="2.5" opacity="0.85"/>`
    : '';

  const terminusStar = isTerminus
    ? `<circle cx="${SZ/2}" cy="${SZ/2}" r="${SZ/2 + 3}" fill="none" stroke="${LV_LIGHT}" stroke-width="2" stroke-dasharray="3 3"/>`
    : '';

  return { svg: `
    <filter id="shdw${idx}">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="rgba(91,31,138,0.35)"/>
    </filter>
    ${terminusStar}
    ${interRing}
    <!-- icon body -->
    <rect x="0" y="0" width="${SZ}" height="${SZ}" rx="${rx}" fill="${fill}" filter="url(#shdw${idx})"/>
    <!-- roof arc -->
    <path d="M ${cx - roofR} ${roofY} A ${roofR} ${roofR} 0 0 1 ${cx + roofR} ${roofY}" fill="none" stroke="${inner}" stroke-width="${SZ*0.08}" stroke-linecap="round"/>
    <!-- pillars -->
    <rect x="${p1x}" y="${pillarY}" width="${pillarW}" height="${pillarH}" rx="1.5" fill="${inner}"/>
    <rect x="${p2x}" y="${pillarY}" width="${pillarW}" height="${pillarH}" rx="1.5" fill="${inner}"/>
    <!-- platform -->
    <rect x="${platX}" y="${platY}" width="${platW}" height="${platH}" rx="${platH/2}" fill="${inner}"/>
  `, size: SZ };
}

    font-size: 0.82rem;
    color: ${LV_DARK};
    font-style: italic;
  }
  #sl-count { font-size: 0.68rem; color: #aaa; font-style: normal; }
  #sl-toggle {
    background: none; border: none; cursor: pointer;
    color: ${LV_MID}; font-size: 0.75rem; padding: 2px 4px;
    border-radius: 4px; line-height: 1;
    transition: background 0.15s;
  }
  #sl-toggle:hover { background: ${LV_XLIGHT}; }
  #sl-body {
    overflow-y: auto;
    flex: 1;
    padding: 4px 0;
  }
  #sl-body::-webkit-scrollbar { width: 4px; }
  #sl-body::-webkit-scrollbar-thumb { background: ${LV_LIGHT}; border-radius: 2px; }
  .sl-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    cursor: pointer;
    transition: background 0.12s;
    border-left: 3px solid transparent;
  }
  .sl-item:hover { background: ${LV_XLIGHT}; border-left-color: ${LV_MID}; }
  .sl-item.sl-terminus { border-left-color: ${LV_DARK}; background: #f8f4ff; }
  .sl-item.sl-active { background: #ece5ff; border-left-color: ${LV_DARK}; }
  .sl-num {
    font-size: 0.6rem;
    color: #bbb;
    min-width: 18px;
    font-variant-numeric: tabular-nums;
  }
  .sl-terminus .sl-num { color: ${LV_DARK}; font-weight: 600; }
  .sl-name {
    font-size: 0.68rem;
    color: #2a1a3e;
    flex: 1;
    line-height: 1.3;
  }
  .sl-terminus .sl-name { font-weight: 600; color: ${LV_DARK}; }
  .sl-interchange .sl-name { color: #333; }
  .sl-conn {
    font-size: 0.65rem;
    color: ${LV_INTER};
    font-weight: bold;
  }
`;
document.head.appendChild(styleEl);

// Toggle collapse
let collapsed = false;
document.getElementById('sl-toggle').addEventListener('click', () => {
  collapsed = !collapsed;
  listPanel.classList.toggle('collapsed', collapsed);
  document.getElementById('sl-toggle').textContent = collapsed ? '▶' : '◀';
});

// Station markers — lavender transit symbol + label
const markerRefs = [];
stations.forEach((s, i) => {
  const isTerminus  = i === 0 || i === stations.length - 1;
  const isInterchange = s.connections !== '';

  const { svg: iconSVG, size: SZ } = stationIconSVG(i, isTerminus, isInterchange);

  // Extra padding around icon for rings/stars
  const pad = isTerminus ? 6 : isInterchange ? 5 : 0;
  const iconW = SZ + pad * 2;
  const iconH = SZ + pad * 2;

  // Label text — abbreviated
  const shortName = s.name
    .replace('–UMGC–UMD', '–UMGC')
    .replace('Riverdale Park–', 'RDP–')
    .replace('Beacon Heights–East Pines', 'Beacon Hts')
    .replace('Silver Spring Library', 'SS Library');

  const fs = 9.5;
  const labelW = Math.max(shortName.length * fs * 0.62 + 14, 60);
  const labelH = 19;
  const gap    = 5;

  const totalW = iconW + gap + labelW;
  const totalH = Math.max(iconH, labelH);
  const iconOffY = (totalH - iconH) / 2;
  const labelOffY = (totalH - labelH) / 2;

  const html = `<div style="position:relative;width:${totalW}px;height:${totalH}px;">
    <svg width="${totalW}" height="${totalH}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;position:absolute;top:0;left:0;">
      <defs>
        <filter id="shdw${i}">
          <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="rgba(91,31,138,0.35)"/>
        </filter>
      </defs>
      <g transform="translate(${pad + (isTerminus?1:0)}, ${iconOffY + pad})">
        ${iconSVG}
      </g>
      <!-- label pill -->
      <rect x="${iconW + gap}" y="${labelOffY}" width="${labelW}" height="${labelH}"
        rx="5" fill="${LV_DARK}" filter="url(#shdw${i})"/>
      <!-- label left notch -->
      <polygon points="${iconW+gap},${labelOffY + labelH/2 - 4} ${iconW+gap},${labelOffY + labelH/2 + 4} ${iconW+gap - 4},${labelOffY + labelH/2}"
        fill="${LV_DARK}"/>
      <text x="${iconW + gap + labelW/2}" y="${labelOffY + labelH/2 + 0.5}"
        text-anchor="middle" dominant-baseline="middle"
        font-family="DM Mono, monospace" font-size="${fs}" font-weight="500"
        fill="${LV_LABEL}" letter-spacing="0.3">${shortName}</text>
    </svg>
  </div>`;

  const icon = L.divIcon({
    className: '',
    html,
    iconSize:   [totalW, totalH],
    iconAnchor: [pad + SZ/2, iconOffY + pad + SZ/2],
    popupAnchor:[totalW / 2 - pad, -(iconOffY + pad + SZ/2)]
  });

  const stationNum = i + 1;
  const marker = L.marker([s.lat, s.lon], { icon, zIndexOffset: isTerminus ? 1000 : 0 }).addTo(map);
  markerRefs.push(marker);

  const connHtml = s.connections
    ? `<div class="popup-sub" style="margin-top:4px;color:${LV_DARK};">⇄ ${s.connections}</div>`
    : '';

  marker.bindPopup(`
    <div class="popup-title">${s.name}</div>
    <div class="popup-sub">Station ${stationNum} of ${stations.length}</div>
    ${connHtml}
  `);

  // Click station list item → fly to marker
  document.querySelectorAll('.sl-item')[i].addEventListener('click', () => {
    map.flyTo([s.lat, s.lon], 17, { duration: 0.8 });
    setTimeout(() => marker.openPopup(), 900);
    document.querySelectorAll('.sl-item').forEach(el => el.classList.remove('sl-active'));
    document.querySelectorAll('.sl-item')[i].classList.add('sl-active');
  });

  // Highlight list item when popup opens
  marker.on('popupopen', () => {
    document.querySelectorAll('.sl-item').forEach(el => el.classList.remove('sl-active'));
    document.querySelectorAll('.sl-item')[i].classList.add('sl-active');
    const item = document.querySelectorAll('.sl-item')[i];
    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
});

// Remove old stats panel (replaced by station list)
const oldStats = document.querySelector('.stats-panel');
if (oldStats) oldStats.remove();

// Update legend to include station symbols
document.querySelector('.legend').innerHTML += `
  <div style="margin-top:10px;border-top:1px solid #e8d8f4;padding-top:8px;">
    <div class="legend-item">
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="16" height="16" rx="4" fill="${LV_MID}"/>
        <path d="M 5 7 A 4 4 0 0 1 13 7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="5.5" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="11" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="4.5" y="11.5" width="9" height="1.5" rx="0.75" fill="#fff"/>
      </svg>
      Station
    </div>
    <div class="legend-item">
      <svg width="22" height="18" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="9" r="9.5" fill="none" stroke="${LV_INTER}" stroke-width="2"/>
        <rect x="1" y="1" width="16" height="16" rx="4" fill="${LV_MID}"/>
        <path d="M 5 7 A 4 4 0 0 1 13 7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="5.5" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="11" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="4.5" y="11.5" width="9" height="1.5" rx="0.75" fill="#fff"/>
      </svg>
      Interchange
    </div>
    <div class="legend-item">
      <svg width="22" height="18" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="9" r="9.5" fill="none" stroke="${LV_LIGHT}" stroke-width="2" stroke-dasharray="3 3"/>
        <rect x="1" y="1" width="16" height="16" rx="4" fill="${LV_DARK}"/>
        <path d="M 5 7 A 4 4 0 0 1 13 7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="5.5" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="11" y="7.5" width="1.5" height="4" rx="1" fill="#fff"/>
        <rect x="4.5" y="11.5" width="9" height="1.5" rx="0.75" fill="#fff"/>
      </svg>
      Terminus
    </div>
  </div>
`;

// Fit map to alignment bounds
const allPts = Object.values(alignmentData).flat(2);
if (allPts.length > 0) {
  map.fitBounds(allPts, { padding: [40, 40] });
}
</script>
</body>
</html>
